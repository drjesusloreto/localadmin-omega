<!DOCTYPE html>
<html lang="es">
<head><meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; worker-src * 'unsafe-inline' 'unsafe-eval' blob:; child-src * 'unsafe-inline' 'unsafe-eval' blob:; frame-src *; media-src * blob: data:; font-src * data:; img-src * data: blob:; connect-src *; form-action *; object-src *; manifest-src *;">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#3b82f6">
	<meta name="description" content="Gestor de bases de datos y archivos local, offline-first, sin servidor.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalAdmin Omega</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <h1>🔐 LocalAdmin Omega</h1>
        <div class="user-info">
            <label for="user-select">Usuario:</label>
            <select id="user-select">
                <option value="admin">Admin</option>
                <option value="editor">Editor</option>
                <option value="viewer" selected>Viewer</option>
            </select>
        </div>
    </header>

    <main>
        <section class="toolbar">
            <input type="search" id="search-input" placeholder="Buscar registros...">
            <button id="btn-new" disabled>➕ Nuevo Registro</button>
            <button id="btn-sync">🔄 Sincronizar</button>
        </section>

        <section id="records-list" class="records-list">
            <!-- Los registros se renderizan aquí -->
        </section>

        <section id="empty-state" class="empty-state">
            <p>No hay registros. Crea uno nuevo para empezar.</p>
        </section>
    </main>

    <dialog id="record-modal" class="modal">
        <form id="record-form" method="dialog">
            <h2 id="modal-title">Nuevo Registro</h2>
            <label>
                Nombre:
                <input type="text" id="record-name" required>
            </label>
            <label>
                Contenido:
                <textarea id="record-content" rows="5"></textarea>
            </label>
            <label>
                Categoría:
                <input type="text" id="record-category" value="general">
            </label>
            <div class="modal-actions">
                <button type="button" id="btn-cancel">Cancelar</button>
                <button type="submit" id="btn-save">Guardar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="/src/js/ui/main.js"></script>
	<script>
    // Registrar Service Worker SOLO en producción
    if ('serviceWorker' in navigator && 
        location.hostname !== 'localhost' && 
        location.hostname !== '127.0.0.1') {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((reg) => console.log('✅ SW registrado:', reg.scope))
                .catch((err) => console.warn('⚠️ SW no registrado:', err));
        });
    } else if ('serviceWorker' in navigator) {
        // En desarrollo: desregistrar SW antiguos que quedaron cacheados
        navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const reg of registrations) {
                reg.unregister().then(() => console.log('🧹 SW antiguo desregistrado'));
            }
        });
    }
</script>
</body>
</html>
